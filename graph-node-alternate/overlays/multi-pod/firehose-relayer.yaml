---
apiVersion: v1
kind: Service
metadata:
  name: persistencecore-firehose-relayer
  labels:
    app.kubernetes.io/name: persistencecore-firehose-relayer
spec:
  clusterIP: None
  ports:
    - name: relayer-grpc
      port: 10014
      protocol: TCP
      targetPort: 10014
    - name: prometheus-firehose
      port: 9102
      protocol: TCP
      targetPort: 9102
  selector:
    app.kubernetes.io/name: persistencecore-firehose-relayer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistencecore-firehose-relayer
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: persistencecore
      app.kubernetes.io/name: persistencecore-firehose-relayer
  template:
    metadata:
      annotations:
        quality: release
        role: api-gateway
        sla: high
        tier: gateway
      labels:
        app.kubernetes.io/instance: persistencecore
        app.kubernetes.io/type: persistencecore-firehose-relayer
        app.kubernetes.io/name: persistencecore-firehose-relayer
        app.kubernetes.io/version: '0.1'
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: firehose-relayer-node
          image: ghcr.io/persistenceone/firecore-firepersistence:0.1
          imagePullPolicy: Always
          env:
            - name: FIRST_STREAMABLE_BLOCK
              valueFrom:
                configMapKeyRef:
                  key: first_streamable_block
                  name: firehose-node-config
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: aws_access_key_id
                  name: firehose-node-aws-credentials
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: aws_secret_access_key
                  name: firehose-node-aws-credentials
          command:
            - bash
            - "-c"
            - |
              export NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              exec firecore start relayer \
                --config-file= \
                --log-format=stackdriver \
                --log-to-file=false \
                --data-dir=/fh-data \
                --common-auto-max-procs \
                --common-auto-mem-limit-percent=90 \
                --relayer-source persistencecore-firehose-reader.$NAMESPACE.svc.cluster.local:10010 \
                --common-first-streamable-block $FIRST_STREAMABLE_BLOCK
          resources:
            limits:
              cpu: "0.25"
              memory: "0.5G"
            requests:
              cpu: "0.25"
              memory: "0.5G"
      volumes:
        - name: config-graph
          configMap:
            name: config-graph
        - name: scripts-graph
          configMap:
            name: scripts-graph